name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all edge functions
        run: supabase functions deploy --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy shopify-auth-callback without JWT verification
        run: supabase functions deploy shopify-auth-callback --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy ebay-auth-callback without JWT verification
        run: supabase functions deploy ebay-auth-callback --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy smart-api without JWT verification
        run: supabase functions deploy smart-api --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy app-subscription-update without JWT verification
        run: supabase functions deploy app-subscription-update --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy app-uninstalled without JWT verification
        run: supabase functions deploy app-uninstalled --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy shop-redact without JWT verification
        run: supabase functions deploy shop-redact --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy customers-redact without JWT verification
        run: supabase functions deploy customers-redact --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy customers-data-request without JWT verification
        run: supabase functions deploy customers-data-request --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy shopify-order-webhook without JWT verification
        run: supabase functions deploy shopify-order-webhook --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy ebay-notification-webhook without JWT verification
        run: supabase functions deploy ebay-notification-webhook --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # WooCommerce and Etsy call these directly when an order comes in — they can't send a
      # Tandril login token. Both re-read stock/orders from the platform API rather than
      # trusting the payload (WooCommerce also verifies its HMAC signature).
      - name: Deploy woocommerce-order-webhook without JWT verification
        run: supabase functions deploy woocommerce-order-webhook --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy etsy-order-webhook without JWT verification
        run: supabase functions deploy etsy-order-webhook --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Called by our own cron jobs, other edge functions, or Vercel's api/ routes with the
      # new secret key (sb_secret_...) on the apikey header. That key isn't a JWT, so the
      # platform's JWT check would reject these calls; each function checks the key itself
      # with isServiceRequest() from _shared/supabaseKeys.ts (and, for the ones users also
      # call — sync-inventory-levels, link-products — validates the user's login).
      - name: Deploy server-to-server functions without JWT verification
        run: |
          for fn in execute-scheduled-workflows process-sync-retries process-price-restores \
                    process-scheduled-sales generate-orion-digest sync-ad-performance \
                    check-platform-connections sync-inventory-levels link-products \
                    register-shopify-webhooks shopify-app-install; do
            supabase functions deploy "$fn" --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
